  <desc
     id="desc1">PyEvoc logo: concentric circle icon divided into four quadrants with scattered dots representing lexical items in each representational zone, alongside the pyEvoc wordmark in teal and dark purple, with tagline &quot;social representation analysis · python&quot;.</desc>
