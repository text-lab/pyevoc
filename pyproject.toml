[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyevoc"
version = "0.1.0"
description = "Computational Hierarchical Evocation Analysis for large-scale digital textual corpora."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Text Processing :: Linguistic",
]

authors = [
  {name = "Michelangelo Misuraca"}
]

keywords = ["social representations", "hierarchical evocation method", "text mining", "digital discourse", "social media"]

dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "regex>=2023.0.0",
  "emoji>=2.0",
  "matplotlib>=3.7",
  "plotly>=5.0"
]

[project.optional-dependencies]
nlp = ["stanza>=1.8", "fasttext-wheel>=0.9.2"]
dev = ["pytest", "ruff", "build"]

[tool.setuptools]
packages = {find = {include = ["pyevoc*"]}}
include-package-data = true

[tool.setuptools.package-data]
pyevoc = ["models/*.csv", "models/anchors/*.txt"]
