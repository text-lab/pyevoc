[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyevoc"
version = "0.1.0"
description = "Computational Hierarchical Evocation Analysis for Digital Corpora"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
  {name = "Michelangelo Misuraca"}
]
keywords = [
    "social representations",
    "hierarchical evocation method",
    "text mining",
    "digital discourse",
    "social media"
]
dependencies = [
    "pandas>=1.5",
    "numpy>=1.23,<2",
    "scikit-learn>=1.2",
    "regex>=2023.0",
    "tqdm>=4.65",
]

[project.optional-dependencies]
nlp = [
    "stanza>=1.7",
    "fasttext-wheel>=0.9",
    "emoji>=2.0",
]
viz = [
    "matplotlib>=3.6",
    "plotly>=5.0",
]
